<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share-Log | Obsidian Graph Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="background-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="app-container">
    <header class="app-header minimal-header">
      <div class="header-left">
        <h1 id="project-title">Share-Log</h1>
        <div class="node-pill">
          <span class="status-dot online"></span>
          <span id="node-id-display">Node: Connecting...</span>
        </div>
      </div>

      <div class="header-right">
        <!-- View Switcher -->
        <div class="view-switcher-group">
          <button id="btn-view-graph" class="btn-mode active" title="Obsidianノードグラフ (メイン)">
            🌌 グラフ
          </button>
          <button id="btn-view-tree" class="btn-mode" title="ツリー表示">
            🌳 ツリー
          </button>
          <button id="btn-view-kanban" class="btn-mode" title="カンバン表示">
            📋 カンバン
          </button>
        </div>
      </div>
    </header>

    <!-- Parent & Action Confirmation Modal Dialog -->
    <div id="confirm-parent-modal" class="modal-backdrop hidden">
      <div class="modal-card">
        <div class="modal-icon" id="confirm-modal-icon">📁</div>
        <h3 id="confirm-modal-title">確認ダイアログ</h3>
        <p id="confirm-modal-text">操作を実行しますか？ (Enterキーで実行)</p>
        <div class="modal-actions">
          <button id="btn-modal-cancel" class="btn-modal btn-cancel">キャンセル (Esc)</button>
          <button id="btn-modal-confirm" class="btn-modal btn-confirm">確定 (Enter)</button>
        </div>
      </div>
    </div>

    <!-- Error Toast Notification -->
    <div id="error-toast" class="toast hidden"></div>

    <main class="main-content">
      <!-- ChatGPT-style Task Input Bar & Side-by-Side Unclassified Panel Dock -->
      <section class="task-input-section" id="input-section">
        <form id="quick-task-form" class="chatgpt-prompt-bar">
          <div class="prompt-pill-select">
            <select id="select-quick-parent" title="親タスクを指定 (任意)">
              <option value="">📁 ルートタスク</option>
            </select>
          </div>

          <input type="text" id="quick-title-input" placeholder="新しいタスクを入力... (Enterで即時作成)" required
            autocomplete="off" />

          <button type="submit" class="btn-send-prompt" title="タスクを作成">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </form>

        <!-- Tree View Side-by-Side Unclassified Inbox Panel -->
        <div id="tree-unclassified-panel" class="tree-unclassified-panel glass-card hidden">
          <div class="unclassified-panel-header">
            <span>📦 未分類ボックス (ドラッグでツリーへ)</span>
            <span id="unclassified-count-badge" class="unclassified-badge">0</span>
          </div>
          <div id="tree-unclassified-list" class="unclassified-panel-list"></div>
        </div>
      </section>

      <!-- VIEW 1: Obsidian-like Node Graph Canvas View (Default Front-and-Center) -->
      <section id="obsidian-graph-view" class="view-section glass-card full-graph-view">
        <!-- Screen Edge Nesting Depth Control -->
        <div id="depth-filter-control" class="depth-filter-control glass-card">
          <span class="depth-label">ネスト表示:</span>
          <button class="depth-btn" data-depth="1">1階層</button>
          <button class="depth-btn active" data-depth="2">2階層 (標準)</button>
          <button class="depth-btn" data-depth="3">3階層</button>
          <button class="depth-btn" data-depth="all">すべて</button>
        </div>

        <div class="canvas-wrapper">
          <canvas id="obsidian-canvas" width="1200" height="650"></canvas>
        </div>
      </section>

      <!-- VIEW 2: Pure Single-Canvas Tree View -->
      <section id="pure-tree-view" class="view-section glass-card hidden">
        <div class="tree-canvas-header">
          <h2>🌳 樹状ツリー表示</h2>
        </div>
        <div id="pure-tree-container" class="pure-tree-container"></div>
      </section>

      <!-- VIEW 3: 3-Column Kanban Board View -->
      <section id="kanban-view" class="view-section kanban-board hidden">
        <div class="kanban-column glass-card" id="col-todo" data-status="TODO">
          <div class="column-header">
            <div class="column-title">
              <span class="badge badge-todo">未着手</span>
              <h2>To Do</h2>
            </div>
            <span class="task-count" id="count-todo">0</span>
          </div>
          <div class="task-list" id="list-todo"></div>
        </div>

        <div class="kanban-column glass-card" id="col-in-progress" data-status="IN_PROGRESS">
          <div class="column-header">
            <div class="column-title">
              <span class="badge badge-progress">進行中</span>
              <h2>In Progress</h2>
            </div>
            <span class="task-count" id="count-in-progress">0</span>
          </div>
          <div class="task-list" id="list-in-progress"></div>
        </div>

        <div class="kanban-column glass-card" id="col-done" data-status="DONE">
          <div class="column-header">
            <div class="column-title">
              <span class="badge badge-done">完了</span>
              <h2>Done</h2>
            </div>
            <span class="task-count" id="count-done">0</span>
          </div>
          <div class="task-list" id="list-done"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>

</html>
