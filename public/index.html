<!DOCTYPE html>
<html lang="ja" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WBSer | Obsidian Graph Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=zones_v2">
</head>

<body>
  <div class="app-container">
    <!-- Global Drag-to-Root Dropzone Header -->
    <div id="root-dropzone" class="root-dropzone hidden">
      <div class="root-dropzone-content">
        <span class="root-dropzone-text">[ ここにドラッグでルート要素 (親なし) に昇格 ]</span>
      </div>
    </div>

    <!-- Parent & Action Confirmation Modal Dialog -->
    <div id="confirm-parent-modal" class="modal-backdrop hidden">
      <div class="modal-card">
        <h3 id="confirm-modal-title">確認ダイアログ</h3>
        <p id="confirm-modal-text">操作を実行しますか？ (Enterキーで実行)</p>
        <div class="modal-actions">
          <button id="btn-modal-cancel" class="btn-modal btn-cancel">キャンセル (Esc)</button>
          <button id="btn-modal-confirm" class="btn-modal btn-confirm">確定 (Enter)</button>
        </div>
      </div>
    </div>

    <!-- Deletion Reason Modal Dialog (for tasks with 3+ child subtasks) -->
    <div id="delete-reason-modal" class="modal-backdrop hidden">
      <div class="modal-card">
        <h3>削除理由の入力が必要</h3>
        <p>このタスクには3つ以上の子要素が含まれています。削除理由を10文字以上で入力してください。</p>
        <textarea id="delete-reason-input" class="modal-textarea" rows="3" placeholder="削除理由を10文字以上で入力してください..."></textarea>
        <div class="char-count-display"><span id="delete-reason-count">0</span> / 10文字以上</div>
        <div class="modal-actions">
          <button id="btn-delete-reason-cancel" class="btn-modal btn-cancel">キャンセル (Esc)</button>
          <button id="btn-delete-reason-confirm" class="btn-modal btn-confirm" disabled>削除実行</button>
        </div>
      </div>
    </div>

    <!-- Mandatory Due Date Modal for IN_PROGRESS Status -->
    <div id="in-progress-due-modal" class="modal-backdrop hidden">
      <div class="modal-card">
        <h3>完了予定日の入力が必要</h3>
        <p>ステータスを「進行中」に変更するには、完了予定日の設定が必須です。</p>
        <input type="date" id="in-progress-date-input" class="modal-date-input" />
        <div class="modal-actions">
          <button id="btn-in-progress-cancel" class="btn-modal btn-cancel">キャンセル (Esc)</button>
          <button id="btn-in-progress-confirm" class="btn-modal btn-confirm">設定して進行中にする (Enter)</button>
        </div>
      </div>
    </div>

    <!-- Error Toast Notification -->
    <div id="error-toast" class="toast hidden"></div>

    <main class="main-content">
      <!-- VIEW 1: Obsidian-like Node Graph Canvas View (Full 100vh Workspace) -->
      <section id="obsidian-graph-view" class="view-section full-graph-view">
        <!-- Unified Top Toolbar Bar (Brand, Node status, Undo, Controls, Theme) -->
        <div class="graph-top-toolbar">
          <div class="toolbar-brand-group">
            <h1 id="project-title" class="brand-title">WBSer</h1>
            <div id="node-pill" class="node-pill" title="端末P2P接続状況">
              <span class="status-dot online"></span>
              <span id="node-id-display">Node: Connecting...</span>
            </div>
            <button id="btn-undo" class="btn-undo" title="自端末の直前操作を取り消す">
              ↺ 戻す
            </button>
          </div>

          <div class="toolbar-spacer"></div>

          <!-- Screen Edge Nesting Depth Control, Days Range Control & Text Size Control -->
          <div id="depth-filter-control" class="depth-filter-control glass-card">
            <div class="control-group">
              <span class="depth-label" id="depth-filter-label">ネスト:</span>
              <button type="button" class="depth-btn" data-depth="1">1階層</button>
              <button type="button" class="depth-btn" data-depth="2">2階層</button>
              <button type="button" class="depth-btn" data-depth="3">3階層</button>
              <button type="button" class="depth-btn active" data-depth="all">すべて</button>
            </div>
            <span class="control-divider" id="days-filter-divider"></span>
            <div class="control-group" id="days-filter-group">
              <span class="depth-label">表示日数:</span>
              <button type="button" class="days-btn" data-days="7">7日</button>
              <button type="button" class="days-btn active" data-days="14">14日</button>
              <button type="button" class="days-btn" data-days="30">30日</button>
              <button type="button" class="days-btn" data-days="60">60日</button>
            </div>
            <span class="control-divider"></span>
            <div class="control-group">
              <span class="depth-label">文字:</span>
              <button type="button" class="fontsize-btn" data-size="small">小</button>
              <button type="button" class="fontsize-btn active" data-size="medium">中</button>
              <button type="button" class="fontsize-btn" data-size="large">大</button>
            </div>
          </div>

          <!-- Theme Switcher Button -->
          <button id="btn-theme-toggle" class="btn-icon-theme" title="ダーク/ライトモード切り替え">
            <span id="theme-toggle-icon">🌙</span>
          </button>
        </div>

        <div class="canvas-wrapper">
          <canvas id="obsidian-canvas" width="1200" height="700"></canvas>
        </div>
      </section>

      <!-- Bottom Controls Dock: Stacks Inspector above Input Bar -->
      <footer id="bottom-controls-dock" class="bottom-controls-dock">
        <!-- Node Click Quick Inspector Dock (Docked directly above input section) -->
        <div id="obsidian-inspector" class="obsidian-inspector-dock hidden">
          <div class="inspector-header">
            <div id="inspector-breadcrumb" class="inspector-breadcrumb"></div>
            <span class="inspector-badge" id="inspector-status-badge">TODO</span>
            <input type="text" id="inspector-title-input" class="inspector-title-input" placeholder="タスクタイトル..." />
            <div class="inspector-due-date-group">
              <label for="inspector-due-date-input" class="due-date-label">完了予定日:</label>
              <input type="date" id="inspector-due-date-input" class="inspector-due-date-input" title="完了予定日を設定" />
            </div>
            <div class="status-btn-group">
              <button class="btn-status-toggle" data-status="TODO">未着手</button>
              <button class="btn-status-toggle" data-status="IN_PROGRESS">進行中</button>
              <button class="btn-status-toggle" data-status="DONE">完了</button>
            </div>
            <div class="action-btn-group">
              <button id="btn-inspector-elevate" class="btn-inspector-action btn-elevate" title="親タスクから切り離してルート要素化">
                ルート化
              </button>
              <button id="btn-inspector-delete" class="btn-inspector-action btn-delete" title="タスクを削除">
                削除
              </button>
            </div>
            <button id="btn-inspector-close" class="btn-inspector-close" title="閉じる">✕</button>
          </div>
        </div>

        <!-- Task Input Bar (Docked at the bottom) -->
        <section class="task-input-section" id="input-section">
          <form id="quick-task-form" class="chatgpt-prompt-bar">
            <div class="prompt-pill-select">
              <select id="select-quick-parent" title="親タスクを指定 (任意)">
                <option value="">ルートタスク (親指定なし)</option>
              </select>
            </div>

            <input type="text" id="quick-title-input" placeholder="新しいタスクを入力... (Enterで即時作成)" required
              autocomplete="off" />

            <button type="submit" class="btn-send-prompt" title="タスクを作成">
              作成
            </button>
          </form>
        </section>
      </footer>
    </main>
  </div>

  <script src="app.js?v=zones_v3"></script>
</body>

</html>
